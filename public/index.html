<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>月饼订单系统</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="topbar">

        <div class="brand">

            <div class="brand-icon">🥮</div>

            <div>
                <h1>月饼订单系统</h1>
                <p>Mooncake Order Management System</p>
            </div>

        </div>


        <div class="user-info">
            <span>员工管理系统</span>
        </div>

    </header>


    <main class="container">

        <!-- ================================
             Welcome
        ================================= -->

        <section class="welcome">

            <div>

                <p class="small-title">
                    WELCOME BACK
                </p>

                <h2>
                    订单管理 Dashboard
                </h2>

                <p>
                    管理月饼订单、包装安排及取货记录。
                </p>

            </div>


            <div style="display:flex; gap:10px; align-items:center; flex-wrap:wrap;">

                <a
                    href="daily-summary.html"
                    class="secondary-button"
                    style="text-decoration:none;"
                >
                    📊 每日统计
                </a>


                <button
                    class="new-order-btn"
                    onclick="goToNewOrder()"
                >
                    ＋ 新订单
                </button>

            </div>

        </section>


        <!-- ================================
             Statistics
        ================================= -->

        <section class="stats">


            <div class="stat-card">

                <div class="stat-icon">
                    📋
                </div>

                <div>

                    <p>
                        今日订单
                    </p>

                    <h3 id="todayOrders">
                        0
                    </h3>

                </div>

            </div>


            <div class="stat-card">

                <div class="stat-icon">
                    ⏳
                </div>

                <div>

                    <p>
                        待处理
                    </p>

                    <h3 id="pendingOrders">
                        0
                    </h3>

                </div>

            </div>


            <div class="stat-card">

                <div class="stat-icon">
                    📦
                </div>

                <div>

                    <p>
                        待取货
                    </p>

                    <h3 id="readyOrders">
                        0
                    </h3>

                </div>

            </div>


            <div class="stat-card">

                <div class="stat-icon">
                    ✓
                </div>

                <div>

                    <p>
                        已完成
                    </p>

                    <h3 id="collectedOrders">
                        0
                    </h3>

                </div>

            </div>


        </section>


        <!-- ================================
             Recent Orders
        ================================= -->

        <section class="orders-section">


            <div class="section-header">

                <div>

                    <h2>
                        最近订单
                    </h2>

                    <p>
                        查看和管理客户订单
                    </p>

                </div>


                <button
                    class="view-all-btn"
                    onclick="viewAllOrders()"
                >
                    查看全部
                </button>

            </div>


            <!-- Loading -->

            <div
                id="ordersLoading"
                class="empty-state"
            >

                <div class="empty-icon">
                    ⏳
                </div>

                <h3>
                    正在加载订单
                </h3>

                <p>
                    请稍候……
                </p>

            </div>


            <!-- No orders -->

            <div
                id="emptyOrders"
                class="empty-state"
                style="display: none;"
            >

                <div class="empty-icon">
                    📋
                </div>

                <h3>
                    目前没有订单
                </h3>

                <p>
                    创建第一个订单后，
                    订单会显示在这里。
                </p>

                <button
                    class="primary-btn"
                    onclick="goToNewOrder()"
                >
                    ＋ 创建新订单
                </button>

            </div>


            <!-- Orders -->

            <div
                id="ordersList"
                class="recent-orders-list"
                style="display: none;"
            >

            </div>


        </section>


    </main>


    <script>


        // ========================================
        // 前往创建订单
        // ========================================

        function goToNewOrder() {

            window.location.href = 'order.html';

        }


        // ========================================
        // 查看全部订单
        // ========================================

        function viewAllOrders() {

            window.location.href = 'orders.html';

        }


        // ========================================
        // 状态文字
        // ========================================

        function getStatusText(status) {

            switch (status) {

                case 'pending':
                    return '待处理';

                case 'ready':
                    return '待取货';

                case 'collected':
                    return '已完成';

                default:
                    return status;

            }

        }


        // ========================================
        // 包装方式文字
        // ========================================

        function getPackagingText(mode) {

            switch (mode) {

                case 'mixed':
                    return '员工自行分盒';

                case 'separate':
                    return '每盒一种口味';

                case 'custom':
                    return '客户指定每一盒';

                default:
                    return mode;

            }

        }


        // ========================================
        // 日期格式
        // ========================================

        function formatDate(dateString) {

            if (!dateString) {
                return '-';
            }

            const date =
                new Date(dateString);

            if (isNaN(date.getTime())) {
                return dateString;
            }

            const year =
                date.getFullYear();

            const month =
                String(
                    date.getMonth() + 1
                ).padStart(2, '0');

            const day =
                String(
                    date.getDate()
                ).padStart(2, '0');

            return `${day}/${month}/${year}`;

        }


        // ========================================
        // 创建订单 HTML
        // ========================================

        function createOrderCard(order) {

            const card =
                document.createElement('div');

            card.className =
                'recent-order-card';


            card.innerHTML = `

                <div class="recent-order-main">

                    <div class="recent-order-number">

                        <strong>
                            订单 #${order.order_id}
                        </strong>

                        <span class="order-status status-${order.status}">
                            ${getStatusText(order.status)}
                        </span>

                    </div>


                    <div class="recent-order-info">

                        <span>
                            📞 ${order.phone_number || '-'}
                        </span>

                        <span>
                            📅 ${formatDate(order.collection_date)}
                        </span>

                        <span>
                            📦 ${getPackagingText(order.packaging_mode)}
                        </span>

                    </div>

                </div>


                <div class="recent-order-action">

                    <button
                        type="button"
                        onclick="viewOrder(${order.order_id})"
                    >
                        查看
                    </button>

                </div>

            `;


            return card;

        }


        // ========================================
        // 查看订单
        // ========================================

        function viewOrder(orderId) {

            window.location.href =
                `order-detail.html?id=${orderId}`;

        }


        // ========================================
        // 加载 Dashboard
        // ========================================

        async function loadDashboard() {

            const loading =
                document.getElementById(
                    'ordersLoading'
                );

            const empty =
                document.getElementById(
                    'emptyOrders'
                );

            const list =
                document.getElementById(
                    'ordersList'
                );


            try {

                const response =
                    await fetch(
                        '/api/dashboard'
                    );


                if (!response.ok) {

                    throw new Error(
                        '无法取得 Dashboard 数据'
                    );

                }


                const data =
                    await response.json();


                // ================================
                // 更新统计数字
                // ================================

                document.getElementById(
                    'todayOrders'
                ).textContent =
                    data.todayOrders;


                document.getElementById(
                    'pendingOrders'
                ).textContent =
                    data.pending;


                document.getElementById(
                    'readyOrders'
                ).textContent =
                    data.ready;


                document.getElementById(
                    'collectedOrders'
                ).textContent =
                    data.collected;


                // ================================
                // 隐藏 Loading
                // ================================

                loading.style.display =
                    'none';


                // ================================
                // 检查有没有订单
                // ================================

                if (
                    !data.recentOrders ||
                    data.recentOrders.length === 0
                ) {

                    empty.style.display =
                        'block';

                    list.style.display =
                        'none';

                    return;

                }


                // ================================
                // 显示订单
                // ================================

                list.innerHTML = '';

                list.style.display =
                    'block';

                empty.style.display =
                    'none';


                data.recentOrders.forEach(
                    order => {

                        list.appendChild(
                            createOrderCard(order)
                        );

                    }
                );


            } catch (error) {

                console.error(
                    'Dashboard loading error:',
                    error
                );


                loading.style.display =
                    'none';


                list.style.display =
                    'none';


                empty.style.display =
                    'block';


                empty.innerHTML = `

                    <div class="empty-icon">
                        ⚠️
                    </div>

                    <h3>
                        无法加载订单
                    </h3>

                    <p>
                        ${error.message}
                    </p>

                `;

            }

        }


        // ========================================
        // 页面打开时加载
        // ========================================

        loadDashboard();


    </script>

</body>
</html>
